name: Deploy Frontend (GHCR)

on:
  push:
    branches:
      - merge-branch


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-front:latest" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.VPS_IP }}:5147/api

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,IMAGE,ACTOR
          script: |
            # Iniciar sesión en el registro desde el VPS
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # Descargar la imagen lista
            docker pull $IMAGE
            
            # Detener el contenedor antiguo
            docker rm -f kinefit-frontend || true
            
            # Levantar el contenedor nuevo
            docker run -d --name kinefit-frontend --restart always -p 3000:3000 $IMAGE