name: Despliegue a Produccion (Hetzner)

on:
  push:
    branches: ["main"] # El robot despierta cuando subes a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: 2. Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construir y subir la imagen (Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kinefit-frontend:latest

      - name: 4. Desplegar en Hetzner VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/kinefit
            docker compose pull frontend
            docker compose up -d frontend
            docker system prune -f
