name: Deploy Frontend

on:
  push:
    branches:
      - main
      - merge-branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # NOTA: Cambia "/var/www/kinefit-frontend" por la ruta real en tu VPS
            cd /var/www/kinefit-frontend
            git pull origin merge-branch
            npm install
            npm run build
            # Si usas pm2 para mantenerlo vivo (recomendado)
            pm2 restart kinefit-frontend || pm2 start npm --name "kinefit-frontend" -- start