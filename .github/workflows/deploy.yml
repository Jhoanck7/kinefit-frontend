name: Deploy Frontend (Docker)

on:
  push:
    branches:
      - main
      - merge-branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (Docker)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # NOTA: Cambia "/var/www/kinefit-frontend" por la ruta real en tu VPS
            cd /var/www/kinefit-frontend
            git pull origin merge-branch
            
            # Construir la imagen de Docker
            docker build -t kinefit-frontend .
            
            # Detener y eliminar el contenedor viejo si existe
            docker rm -f kinefit-frontend-container || true
            
            # Levantar el nuevo contenedor en el puerto 3000
            docker run -d --name kinefit-frontend-container --restart always -p 3000:3000 kinefit-frontend