name: Deploy Frontend Test (GHCR)

on:
  push:
    branches:
      - test-production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-front:test" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.kinefitchile.com/api
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}
          ACTOR: ${{ github.actor }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,IMAGE,ACTOR,AUTH_SECRET
          script: |
            # 1. Iniciar sesión en GHCR desde el VPS
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # 2. Descargar imagen de test
            docker pull $IMAGE
            
            # 3. Detener y remover contenedor de test anterior
            docker rm -f kinefit-frontend-test || true
            
            # 4. Levantar contenedor de test en paralelo (puerto 3001)
            docker run -d --name kinefit-frontend-test \
              -e AUTH_TRUST_HOST=true \
              -e AUTH_URL=https://test.kinefitchile.com \
              -e NEXTAUTH_URL=https://test.kinefitchile.com \
              -e AUTH_SECRET="$AUTH_SECRET" \
              -e NEXTAUTH_SECRET="$AUTH_SECRET" \
              --restart always \
              -p 3001:3000 \
              $IMAGE
            
            # 5. Limpieza de imágenes antiguas
            docker image prune -f